<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axis-Evo Edge</title><link rel="stylesheet" href="popup.css"></head><body>
<header><span class="mark">A</span><div><strong>Axis—Evo</strong><small>Microsoft Edge 连接</small></div></header>
<p id="status" role="status">正在检查本地连接…</p>
<section><h1>你的浏览器，随时协作</h1><p>扩展会自动连接此电脑上的 Axis-Evo。回到工作台选择要处理的标签页即可。</p>
<button id="connect">重新连接</button></section>
<section><h2>当前网站</h2><p id="site">正在读取标签页…</p><button id="grant" class="secondary">允许 Axis 访问此网站</button><small>只授权当前网站。网页登录状态留在 Edge；页面正文不会因连接而自动发送给模型。</small></section>
<button id="disconnect" class="text">断开本实例</button><script src="popup.js" type="module"></script></body></html>
