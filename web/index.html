<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script src="/appearance-bootstrap.js"></script>
    <style>
      html { background: #111110; }
      html[data-theme="light"] { background: #faf9f5; }
      html[data-prism-pending][data-prism-palette="obsidian"] { background: #0e0e11; }
      html[data-prism-pending][data-prism-palette="warm"] { background: #141413; }
      html[data-prism-pending][data-prism-palette="crystal"] { background: #f4f7fb; }
      html[data-prism-pending][data-prism-palette="alabaster"] { background: #f6f4ee; }
      html[data-prism-pending] body { background: transparent; }
      html[data-prism-pending] #root { visibility: hidden; }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="256x256" href="/axis-mark-dark.png" />
    <link rel="apple-touch-icon" href="/axis-mark-dark.png" />
    <title>Axis-Evo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
